name: Validate pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ZapWatch.slnx

      - name: Build
        run: dotnet build ZapWatch.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ZapWatch.slnx --configuration Release --no-build
